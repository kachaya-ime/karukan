[package]
name = "karukan-im-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Windows TSF frontend for the Karukan Japanese IME"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["japanese", "ime", "windows", "tsf"]
categories = ["text-processing", "internationalization"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "karukan-settings"
path = "src/bin/settings.rs"

[dependencies]
karukan-im.workspace = true
karukan-engine.workspace = true
chrono.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
